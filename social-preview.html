<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Social Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
    --card-bg: rgba(30, 41, 59, 0.7);
    --card-border: rgba(255, 255, 255, 0.14);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --primary: #6366f1;
    --success: #10b981;
    --success-border: rgba(16, 185, 129, 0.45);
    --badge-bg: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    background: var(--bg-gradient);
    color: var(--text-main);
    position: relative;
  }
  /* ambient glow blobs, matching app's card-shadow glow language */
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
  }
  .glow-1 { width: 520px; height: 520px; background: #6366f1; top: -220px; left: -140px; opacity: 0.45; }
  .glow-2 { width: 480px; height: 480px; background: #a855f7; bottom: -220px; right: -120px; opacity: 0.4; }
  .glow-3 { width: 360px; height: 360px; background: #10b981; top: 180px; right: 260px; opacity: 0.22; }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    padding: 0 80px;
  }

  .left-col {
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 620px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 22px;
    margin-bottom: 34px;
  }
  .brand-icon {
    font-size: 64px;
    line-height: 1;
  }
  .brand-text h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 58px;
    letter-spacing: -0.5px;
    line-height: 1.05;
  }
  .brand-text .tagline {
    margin-top: 8px;
    font-size: 24px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .lang-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 6px;
  }
  .lang-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--badge-bg);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 12px 26px;
    font-size: 24px;
    font-weight: 600;
    white-space: nowrap;
  }
  .lang-pill.es {
    background: rgba(99, 102, 241, 0.22);
    border-color: rgba(99, 102, 241, 0.55);
  }
  .arrow {
    font-size: 28px;
    color: var(--text-muted);
  }
  .targets {
    display: flex;
    gap: 10px;
  }
  .targets .lang-pill {
    font-size: 19px;
    padding: 9px 18px;
  }

  .footer-row {
    margin-top: 46px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px 30px;
  }
  .feature {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .feature .ico { font-size: 23px; }

  .right-col {
    margin-left: auto;
    flex-shrink: 0;
  }
  .card-mock {
    width: 320px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 30px 26px;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.65), 0 0 50px rgba(99,102,241,0.25);
    transform: rotate(4deg);
    backdrop-filter: blur(6px);
  }
  .card-mock .word-es {
    font-size: 36px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 20px;
  }
  .card-mock .opt {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--card-border);
    border-radius: 11px;
    padding: 13px 16px;
    font-size: 19px;
    margin-bottom: 11px;
    color: var(--text-muted);
  }
  .card-mock .opt.correct {
    background-color: rgba(16,185,129,0.22);
    border-color: var(--success-border);
    color: var(--text-main);
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <div class="stage">
    <div class="left-col">
      <div class="brand">
        <span class="brand-icon">🎴</span>
        <div class="brand-text">
          <h1>Vocabulary Cards</h1>
          <div class="tagline">Spanish flashcard trainer</div>
        </div>
      </div>

      <div class="lang-row">
        <div class="lang-pill es">🇪🇸 Español</div>
        <span class="arrow">➔</span>
        <div class="targets">
          <div class="lang-pill">🇮🇹 IT</div>
          <div class="lang-pill">🇩🇪 DE</div>
          <div class="lang-pill">🇬🇧 EN</div>
          <div class="lang-pill">🇫🇷 FR</div>
          <div class="lang-pill">🇭🇺 HU</div>
        </div>
      </div>

      <div class="footer-row">
        <div class="feature"><span class="ico">🔊</span> Speech synthesis</div>
        <div class="feature"><span class="ico">📝</span> Example sentences</div>
        <div class="feature"><span class="ico">📊</span> 400 words, 2 levels</div>
      </div>
    </div>

    <div class="right-col">
      <div class="card-mock">
        <div class="word-es">el perro</div>
        <div class="opt correct">✓ il cane</div>
        <div class="opt">il gatto</div>
        <div class="opt">l'uccello</div>
        <div class="opt">il cavallo</div>
      </div>
    </div>
  </div>
</body>
</html>
