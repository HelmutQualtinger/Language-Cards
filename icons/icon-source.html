<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; }
  .icon {
    width: 512px;
    height: 512px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
  }
  .icon span {
    font-size: 260px;
    filter: drop-shadow(0 10px 24px rgba(99, 102, 241, 0.5));
  }
</style>
</head>
<body>
  <div class="icon"><span>🎴</span></div>
</body>
</html>
